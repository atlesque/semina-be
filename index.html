<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pini</title>
    <meta name="description" content="Pinininini" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://semina.be/" />
    <meta property="og:title" content="Pini" />
    <meta property="og:description" content="Pinininini" />
    <meta property="og:image" content="https://semina.be/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pini" />
    <meta name="twitter:description" content="Click anywhere to generate a new silly word ending in -ini. A fun, colorful wordmark generator." />
    <meta name="twitter:image" content="https://semina.be/og-image.png" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        --wordmark-max-width: 1280px;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        user-select: none;
        transition: background-color 0.4s ease, color 0.4s ease;
        padding: 4vh 4vw;
        background-color: #ff6b6b;
        color: #1a1a1a;
        overflow: hidden;
      }

      #wordmark {
        font-weight: 900;
        font-family: 'Arial Black', 'Impact', sans-serif;
        letter-spacing: -0.02em;
        line-height: 1;
        text-align: center;
        white-space: nowrap;
        transition: opacity 0.15s ease;
        width: 80vw;
        max-width: var(--wordmark-max-width);
      }

      #bottom-word {
        color: inherit;
        animation: rainbowGlow 3s linear infinite;
      }

      @keyframes rainbowGlow {
        0% {
          text-shadow: 0 0 2px rgba(255, 255, 255, 0.7), 0 0 8px #ff4d4d, 0 0 16px #ff884d;
        }
        20% {
          text-shadow: 0 0 2px rgba(255, 255, 255, 0.7), 0 0 8px #ffcc4d, 0 0 16px #ffee4d;
        }
        40% {
          text-shadow: 0 0 2px rgba(255, 255, 255, 0.7), 0 0 8px #5cff7a, 0 0 16px #2cffcc;
        }
        60% {
          text-shadow: 0 0 2px rgba(255, 255, 255, 0.7), 0 0 8px #4dc3ff, 0 0 16px #4d7dff;
        }
        80% {
          text-shadow: 0 0 2px rgba(255, 255, 255, 0.7), 0 0 8px #c26bff, 0 0 16px #ff66d8;
        }
        100% {
          text-shadow: 0 0 2px rgba(255, 255, 255, 0.7), 0 0 8px #ff4d4d, 0 0 16px #ff884d;
        }
      }

      #hint {
        position: fixed;
        bottom: 1.5rem;
        font-size: 1.1rem;
        font-family: Arial, sans-serif;
        opacity: 0.55;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <h1 id="wordmark" aria-label="Clickini Pini"><span id="top-word">Clickini</span><br><span id="bottom-word">Pini</span></h1>
    <div id="hint" aria-label="Click anywhere to change"><span aria-hidden="true">☝️</span></div>

    <script>
      const words = [
        "Apple", "Banana", "Orange", "Mango", "Lemon", "Peach", "Cherry", "Berry",
        "Cookie", "Muffin", "Waffle", "Pancake", "Noodle", "Pizza", "Burger", "Taco",
        "Rainbow", "Sunshine", "Starlight", "Moonlight", "Cloud", "Thunder", "Breeze", "Meadow",
        "River", "Ocean", "Forest", "Mountain", "Garden", "Flower", "Petal", "Leaf",
        "Kitten", "Puppy", "Bunny", "Panda", "Tiger", "Dolphin", "Penguin", "Butterfly",
        "Rocket", "Planet", "Comet", "Galaxy", "Castle", "Dragon", "Wizard", "Knight",
        "Bubble", "Sparkle", "Glitter", "Jelly", "Candy", "Lollipop", "Marshmallow", "Vanilla",
        "Friend", "Pillow", "Lantern", "Window", "Puzzle", "Rocketship", "Backpack", "Sandbox",
        "Music", "Rhythm", "Melody", "Guitar", "Piano", "Dance", "Disco", "Party",
        "Magic", "Wonder", "Pixel", "Neon", "Flash", "Groovy", "Jumpy", "Bouncy"
      ];

      // Deduplicate and clean the word list
      const uniqueWords = [...new Set(words)];
      let availableWords = [...uniqueWords];

      // Vibrant background palette: hue values to cycle through
      const bgColors = [
        "#ff6b6b", "#ffa94d", "#ffd43b", "#a9e34b", "#40c057",
        "#20c997", "#22b8cf", "#339af0", "#5c7cfa", "#845ef7",
        "#cc5de8", "#f06595", "#ff8787", "#ffc078", "#ffe066",
        "#c0eb75", "#63e6be", "#74c0fc", "#91a7ff", "#da77f2",
        "#e64980", "#d6336c", "#f03e3e", "#e8590c", "#f59f00",
        "#2f9e44", "#0ca678", "#1098ad", "#1971c2", "#7048e8",
        "#b5179e", "#7209b7", "#480ca8", "#3a0ca3", "#023e8a",
        "#006d77", "#264653", "#2a9d8f", "#e9c46a", "#f4a261",
        "#e76f51", "#8ecae6", "#219ebc", "#023047", "#ffb703",
        "#fb8500", "#00b4d8", "#0096c7", "#0077b6", "#023e8a",
        "#d62828", "#f77f00", "#fcbf49", "#eae2b7", "#003049",
        "#6a994e", "#386641", "#bc4749", "#a7c957", "#f2e8cf",
        "#e9c46a", "#57cc99", "#80ed99", "#38a3a5", "#22577a"
      ];

      let lastBgIndex = -1;
      let lastWordIndex = -1;

      function getRelativeLuminance(hex) {
        const r = parseInt(hex.slice(1, 3), 16) / 255;
        const g = parseInt(hex.slice(3, 5), 16) / 255;
        const b = parseInt(hex.slice(5, 7), 16) / 255;
        const toLinear = (c) => c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
        return 0.2126 * toLinear(r) + 0.7152 * toLinear(g) + 0.0722 * toLinear(b);
      }

      function getTextColor(bgHex) {
        const lum = getRelativeLuminance(bgHex);
        return lum > 0.35 ? "#1a1a1a" : "#ffffff";
      }

      const FADE_MS = 150;
      const RESIZE_DEBOUNCE_MS = 100;
      const MAX_TEXT_WIDTH_RATIO = 0.8;
      const MAX_FONT_WIDTH_RATIO = 0.18;
      const MAX_FONT_HEIGHT_RATIO = 0.25;
      const MIN_FONT_SIZE_PX = 28;
      const HINT_CLEARANCE_PX = 24;
      let cachedHintHeight = null;

      function pickRandom(arr, lastIndex) {
        let idx;
        do {
          idx = Math.floor(Math.random() * arr.length);
        } while (idx === lastIndex && arr.length > 1);
        return { value: arr[idx], index: idx };
      }

      function normalizeWord(rawWord) {
        if (typeof rawWord !== "string") return null;
        const cleaned = rawWord.trim().replace(/[^\p{L}'-]/gu, "");
        if (!cleaned) return null;
        return cleaned.charAt(0).toUpperCase() + cleaned.slice(1).toLowerCase();
      }

      function getHintHeight() {
        if (cachedHintHeight !== null) return cachedHintHeight;
        const hintEl = document.getElementById("hint");
        cachedHintHeight = hintEl ? hintEl.getBoundingClientRect().height : 0;
        return cachedHintHeight;
      }

      function fitWordmark() {
        const wordmarkEl = document.getElementById("wordmark");
        const topWordEl = document.getElementById("top-word");
        const bottomWordEl = document.getElementById("bottom-word");
        const maxWidthPx = parseFloat(getComputedStyle(document.body).getPropertyValue("--wordmark-max-width"));
        const safeMaxWidthPx = Number.isFinite(maxWidthPx) ? maxWidthPx : window.innerWidth;
        const maxWidth = Math.min(window.innerWidth * MAX_TEXT_WIDTH_RATIO, safeMaxWidthPx);
        const hintHeight = getHintHeight();
        const bodyStyles = getComputedStyle(document.body);
        const bodyPaddingTop = parseFloat(bodyStyles.paddingTop) || 0;
        const bodyPaddingBottom = parseFloat(bodyStyles.paddingBottom) || 0;
        const availableHeight = window.innerHeight - bodyPaddingTop - bodyPaddingBottom - hintHeight - HINT_CLEARANCE_PX;
        const maxHeight = Math.max(MIN_FONT_SIZE_PX * 2, availableHeight);
        const maxSize = Math.floor(Math.min(window.innerWidth * MAX_FONT_WIDTH_RATIO, window.innerHeight * MAX_FONT_HEIGHT_RATIO));
        let low = MIN_FONT_SIZE_PX;
        let high = Math.max(MIN_FONT_SIZE_PX, maxSize);
        let best = MIN_FONT_SIZE_PX;

        while (low <= high) {
          const mid = Math.floor((low + high) / 2);
          wordmarkEl.style.fontSize = `${mid}px`;
          const hasNoWrapping = topWordEl.getClientRects().length <= 1 && bottomWordEl.getClientRects().length <= 1;
          const fits = wordmarkEl.scrollWidth <= maxWidth && wordmarkEl.scrollHeight <= maxHeight && hasNoWrapping;

          if (fits) {
            best = mid;
            low = mid + 1;
          } else {
            high = mid - 1;
          }
        }

        wordmarkEl.style.fontSize = `${best}px`;
      }

      function update() {
        const { value: word, index: wordIdx } = pickRandom(availableWords, lastWordIndex);
        lastWordIndex = wordIdx;
        const { value: bg, index: bgIdx } = pickRandom(bgColors, lastBgIndex);
        lastBgIndex = bgIdx;

        const prefix = word + "ini";
        const textColor = getTextColor(bg);

        const wordmarkEl = document.getElementById("wordmark");
        const topWordEl = document.getElementById("top-word");
        const bottomWordEl = document.getElementById("bottom-word");
        wordmarkEl.style.opacity = "0";
        setTimeout(() => {
          topWordEl.textContent = prefix;
          bottomWordEl.textContent = "Pini";
          wordmarkEl.setAttribute("aria-label", `${prefix} Pini`);
          requestAnimationFrame(() => {
            fitWordmark();
            wordmarkEl.style.opacity = "1";
          });
        }, FADE_MS);

        document.body.style.backgroundColor = bg;
        document.body.style.color = textColor;
      }

      let resizeTimer = null;
      window.addEventListener("resize", () => {
        cachedHintHeight = null;
        if (resizeTimer) clearTimeout(resizeTimer);
        resizeTimer = setTimeout(fitWordmark, RESIZE_DEBOUNCE_MS);
      });
      document.body.addEventListener("click", update);
      fitWordmark();
      window.addEventListener("load", fitWordmark);
    </script>
  </body>
</html>
