<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pini</title>
    <meta name="description" content="Pinininini" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bangers&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded&display=block"
      rel="stylesheet"
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://semina.be/" />
    <meta property="og:title" content="Pini" />
    <meta property="og:description" content="Pinininini" />
    <meta property="og:image" content="https://semina.be/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pini" />
    <meta
      name="twitter:description"
      content="Click anywhere to generate a new silly word ending in -ini. A fun, colorful wordmark generator."
    />
    <meta name="twitter:image" content="https://semina.be/og-image.png" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        --wordmark-max-width: 1280px;
        --emoji-zone-bottom: 7.5rem;
        --outline-shadow:
          -2px -2px 0 #000, 0 -2px 0 #000, 2px -2px 0 #000, -2px 0 0 #000,
          2px 0 0 #000, -2px 2px 0 #000, 0 2px 0 #000, 2px 2px 0 #000,
          -3px 3px 0 rgba(0, 0, 0, 0.85), -5px 5px 0 rgba(0, 0, 0, 0.7),
          -7px 7px 0 rgba(0, 0, 0, 0.55), -9px 9px 0 rgba(0, 0, 0, 0.4),
          -11px 11px 0 rgba(0, 0, 0, 0.25), -13px 13px 0 rgba(0, 0, 0, 0.12);
        --outline-only-shadow:
          -2px -2px 0 #000, 0 -2px 0 #000, 2px -2px 0 #000, -2px 0 0 #000,
          2px 0 0 #000, -2px 2px 0 #000, 0 2px 0 #000, 2px 2px 0 #000;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        user-select: none;
        transition:
          background-color 0.4s ease,
          color 0.4s ease;
        padding: 4vh 4vw;
        background-color: #ff6b6b;
        color: #ffffff;
        overflow: hidden;
      }

      #wordmark {
        font-weight: 400;
        font-family: "Bangers", "Arial Black", "Impact", sans-serif;
        letter-spacing: 0.05em;
        line-height: 1;
        text-align: center;
        white-space: nowrap;
        width: 80vw;
        max-width: var(--wordmark-max-width);
        text-shadow: var(--outline-shadow);
        transform-style: preserve-3d;
        will-change: transform;
        position: fixed;
        top: 50%;
        left: 50%;
        z-index: 1;
        pointer-events: auto;
        transition:
          opacity 0.15s ease,
          top 0.5s cubic-bezier(0.22, 1, 0.36, 1),
          font-size 0.5s cubic-bezier(0.22, 1, 0.36, 1),
          transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        transform: translate(-50%, -50%) rotateX(var(--tilt-x, 0deg))
          rotateY(var(--tilt-y, 0deg));
      }

      body.game-started #wordmark {
        top: calc(100% - var(--emoji-zone-bottom) - 1.1rem);
        width: min(72vw, 720px);
        pointer-events: none;
        transform: translate(-50%, -100%) rotateX(var(--tilt-x, 0deg))
          rotateY(var(--tilt-y, 0deg));
      }

      #bottom-word {
        color: inherit;
      }

      body.game-started #wordmark-break,
      body.game-started #bottom-word {
        display: none;
      }

      #audio-glow {
        position: fixed;
        z-index: 0;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      #emoji-stream {
        position: fixed;
        z-index: 0;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        overflow: hidden;
        pointer-events: none;
      }

      .scrolling-emoji {
        position: absolute;
        top: calc(var(--emoji-size) * -1);
        left: var(--emoji-left);
        display: block;
        font-size: var(--emoji-size);
        line-height: 1;
        opacity: 0;
        filter: drop-shadow(2px 3px 0 rgba(0, 0, 0, 0.25));
        will-change: transform;
        animation: emojiRain var(--emoji-duration) linear forwards;
        cursor: pointer;
        pointer-events: auto;
        touch-action: manipulation;
        transition: opacity 100ms ease-out;
        z-index: 2;
      }

      .emoji-fade-out {
        opacity: 0;
        pointer-events: none;
      }

      .special-scrolling-emoji {
        z-index: 1;
        filter: drop-shadow(2px 3px 0 rgba(0, 0, 0, 0.35));
      }

      @keyframes emojiRain {
        from {
          transform: translate3d(-50%, 0, 0)
            rotate(var(--emoji-rotation-start));
          opacity: 0;
        }
        10% {
          opacity: 0.82;
        }
        78% {
          opacity: 0.82;
        }
        100% {
          opacity: 0;
          transform: translate3d(-50%, var(--emoji-travel), 0)
            rotate(var(--emoji-rotation-end));
        }
      }

      .confetti-flower {
        position: fixed;
        pointer-events: none;
        font-size: 1.6rem;
        z-index: 1000;
        animation: confettiFly var(--dur, 1.1s) ease-out forwards;
      }

      @keyframes confettiFly {
        0% {
          transform: translate(-50%, -50%) rotate(0deg) scale(1);
          opacity: 1;
        }
        100% {
          transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy)))
            rotate(var(--rot)) scale(0.4);
          opacity: 0;
        }
      }

      #high-score {
        position: fixed;
        z-index: 3;
        top: max(1rem, env(safe-area-inset-top));
        left: max(1rem, env(safe-area-inset-left));
        color: #fff;
        font: 1.5rem/1 "Bangers", "Arial Black", "Impact", sans-serif;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        text-shadow: var(--outline-only-shadow);
        white-space: nowrap;
        pointer-events: none;
      }

      #score-value {
        display: block;
        color: inherit;
        font: inherit;
      }

      #menu-button {
        position: fixed;
        z-index: 3;
        top: max(1rem, env(safe-area-inset-top));
        right: max(1rem, env(safe-area-inset-right));
        display: grid;
        width: 2.4rem;
        height: 2.4rem;
        border: 0;
        background: transparent;
        color: #fff;
        place-items: center;
        text-shadow: var(--outline-only-shadow);
        cursor: pointer;
      }

      #menu-button:hover,
      #menu-button:focus-visible {
        transform: scale(1.08);
      }

      #menu-button .material-symbols-rounded {
        font-size: 1.8rem;
      }

      #game-menu {
        width: min(320px, calc(100vw - 2rem));
        max-width: calc(100vw - 2rem);
        margin: auto;
        border: 0;
        padding: 0;
        background: transparent;
        color: #000;
      }

      #game-menu::backdrop {
        background: rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(3px);
      }

      #menu-card {
        position: relative;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 1.25rem;
        border: 3px solid #000;
        border-radius: 0.8rem;
        padding: 1rem 1.25rem 1.25rem;
        background: #fff;
        box-shadow: 7px 7px 0 rgba(0, 0, 0, 0.4);
      }

      #close-menu {
        position: static;
        grid-column: 2;
        grid-row: 1;
        justify-self: end;
        align-self: center;
        display: grid;
        width: 2rem;
        height: 2rem;
        border: 0;
        border-radius: 0.35rem;
        background: #e6e6e6;
        color: #000;
        place-items: center;
        cursor: pointer;
      }

      #close-menu:hover,
      #close-menu:focus-visible {
        background: #d0d0d0;
      }

      #reset-game {
        grid-column: 1 / -1;
        grid-row: 2;
        border: 2px solid #000;
        border-radius: 0.45rem;
        padding: 0.7rem 1rem;
        background: #000;
        color: #fff;
        font: 1.25rem/1 "Bangers", "Arial Black", "Impact", sans-serif;
        letter-spacing: 0.05em;
        text-shadow: var(--outline-only-shadow);
        cursor: pointer;
        transition:
          background-color 0.15s ease,
          color 0.15s ease;
      }

      #reset-game:hover,
      #reset-game:focus,
      #reset-game:focus-visible {
        background: #fff;
        color: #fff;
      }

      #audio-player {
        position: fixed;
        z-index: 2000;
        right: 1rem;
        bottom: max(1rem, env(safe-area-inset-bottom));
        left: 1rem;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 2.4rem;
        grid-template-rows: auto;
        align-items: center;
        column-gap: 0.75rem;
        width: min(620px, calc(100vw - 2rem));
        margin: 0 auto;
        padding: 0.7rem 0.85rem;
        border: 2px solid rgba(0, 0, 0, 0.75);
        border-radius: 0.75rem;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.35);
        color: #000;
        cursor: default;
        user-select: none;
      }

      #audio-main {
        min-width: 0;
        display: contents;
      }

      .material-symbols-rounded {
        display: inline-block;
        font-family: "Material Symbols Rounded";
        font-size: 1.35rem;
        font-style: normal;
        font-weight: normal;
        line-height: 1;
        letter-spacing: normal;
        text-transform: none;
        white-space: nowrap;
        word-wrap: normal;
        direction: ltr;
        -webkit-font-feature-settings: "liga";
        -webkit-font-smoothing: antialiased;
        font-feature-settings: "liga";
        font-variation-settings: "FILL" 1, "wght" 500, "GRAD" 0, "opsz" 24;
      }

      #background-music {
        grid-column: 1;
        grid-row: 1;
        min-width: 0;
        width: 100%;
      }

      #playlist-settings {
        grid-column: 2;
        grid-row: 1;
        position: relative;
      }

      #playlist-settings summary {
        display: grid;
        width: 2.4rem;
        height: 2.4rem;
        border: 2px solid #000;
        border-radius: 0.45rem;
        background: #fff;
        color: #000;
        place-items: center;
        cursor: pointer;
        list-style: none;
      }

      #playlist-settings summary::-webkit-details-marker {
        display: none;
      }

      #playlist-settings summary:hover,
      #playlist-settings summary:focus-visible,
      #playlist-settings[open] summary {
        background: #000;
        color: #fff;
      }

      #playlist-menu {
        position: absolute;
        right: 0;
        bottom: calc(100% + 0.55rem);
        display: grid;
        gap: 0.3rem;
        width: min(250px, calc(100vw - 2rem));
        padding: 0.45rem;
        border: 2px solid #000;
        border-radius: 0.55rem;
        background: #fff;
        box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.35);
      }

      #playlist-menu button {
        overflow: hidden;
        border: 0;
        border-radius: 0.3rem;
        padding: 0.5rem 0.6rem;
        background: #fff;
        color: #000;
        font: 0.8rem Arial, sans-serif;
        text-align: left;
        text-overflow: ellipsis;
        white-space: nowrap;
        cursor: pointer;
      }

      #playlist-menu button:hover,
      #playlist-menu button:focus-visible,
      #playlist-menu button[aria-current="true"] {
        background: #000;
        color: #fff;
      }

      @media (max-width: 560px) {
        #audio-player {
          column-gap: 0.5rem;
          padding: 0.55rem;
        }

        body.game-started #wordmark {
          width: min(76vw, 440px);
          top: calc(100% - var(--emoji-zone-bottom) - 0.8rem);
        }

      }

      @media (prefers-reduced-motion: reduce) {
        #wordmark {
          transition: opacity 0.15s ease;
        }

        .scrolling-emoji {
          animation-duration: 0.01ms;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="audio-glow" aria-hidden="true"></canvas>
    <div id="emoji-stream" aria-hidden="true"></div>
    <div
      id="high-score"
      role="status"
      aria-live="polite"
      aria-label="High score 0"
    >
      <span id="score-value">0</span>
    </div>
    <button
      id="menu-button"
      type="button"
      aria-label="Open menu"
      aria-controls="game-menu"
      aria-expanded="false"
      title="Open menu"
    >
      <span class="material-symbols-rounded" aria-hidden="true">menu</span>
    </button>
    <h1 id="wordmark" aria-label="Clickini Pini">
      <span id="top-word">Clickini</span>
      <br id="wordmark-break" />
      <span id="bottom-word">Pini</span>
    </h1>
    <div id="audio-player" aria-label="Background music player">
      <div id="audio-main">
        <audio
          id="background-music"
          src="audio/20260916-142727-77c9dd-web-small.mp3"
          autoplay
          preload="auto"
          controls
          aria-label="Pini background music"
        ></audio>
        <script>
          (() => {
            const localHosts = new Set([
              "localhost",
              "127.0.0.1",
              "::1",
              "[::1]",
            ]);
            if (localHosts.has(window.location.hostname)) {
              document.getElementById("background-music").muted = true;
            }
          })();
        </script>
      </div>
      <details id="playlist-settings">
        <summary aria-label="Open playlist" title="Open playlist">
          <span class="material-symbols-rounded" aria-hidden="true">queue_music</span>
        </summary>
        <div id="playlist-menu" role="listbox" aria-label="Playlist"></div>
      </details>
    </div>
    <dialog id="game-menu" aria-label="Game menu">
      <div id="menu-card">
        <button id="close-menu" type="button" aria-label="Close menu">
          <span class="material-symbols-rounded" aria-hidden="true">close</span>
        </button>
        <button id="reset-game" type="button">Reset game</button>
      </div>
    </dialog>

    <script src="scripts/audio-visualizer.js"></script>
    <script src="scripts/audio-player.js?v=compact-1"></script>
    <script src="scripts/emoji-stream.js?v=rain-1"></script>
    <script>
      const basicWords = [
        { word: "Apple", emoji: "🍎" },
        { word: "Banana", emoji: "🍌" },
        { word: "Orange", emoji: "🍊" },
        { word: "Lemon", emoji: "🍋" },
        { word: "Cookie", emoji: "🍪" },
        { word: "Muffin", emoji: "🧁" },
        { word: "Pancake", emoji: "🥞" },
        { word: "Noodle", emoji: "🍜" },
        { word: "Pizza", emoji: "🍕" },
        { word: "Burger", emoji: "🍔" },
        { word: "Forest", emoji: "🌲" },
        { word: "Garden", emoji: "🌿" },
        { word: "Flower", emoji: "🌸" },
        { word: "Kitten", emoji: "🐱" },
        { word: "Dolphin", emoji: "🐬" },
        { word: "Penguin", emoji: "🐧" },
        { word: "Planet", emoji: "🪐" },
        { word: "Glitter", emoji: "✨" },
        { word: "Melody", emoji: "🎵" },
        { word: "Piano", emoji: "🎹" },
        { word: "Pixel", emoji: "🟪" },
      ];
      const customWords = [
        { word: "Admin", emoji: "🧑‍💼" },
        { word: "Shauni", emoji: "🫶" },
        { word: "MBP", emoji: "💻" },
        { word: "Analist", emoji: "📊" },
        { word: "Macedonia", emoji: "🇲🇰" },
        { word: "Fashion", emoji: "👗" },
        { word: "Pini", emoji: "🌲" },
        { word: "Semina", emoji: "🌱" },
        { word: "Mini", emoji: "🔹" },
        { word: "Krul", emoji: "🌀" },
        { word: "Kroket", emoji: "🥔" },
        { word: "Optimi", emoji: "🚀" },
        { word: "Tauri", emoji: "♉" },
        { word: "Santori", emoji: "🕯️" },
        { word: "Wafel", emoji: "🧇" },
        { word: "Trouwring", emoji: "💍" },
        { word: "Griss", emoji: "🪶" },
        { word: "Contactvoorkeur", emoji: "📇" },
        { word: "Acronym", emoji: "🔤" },
      ];

      // Merge + deduplicate, then shuffle and loop through all words
      const allWords = [
        ...new Map(
          [...basicWords, ...customWords].map((entry) => [entry.word, entry]),
        ).values(),
      ];
      let shuffledWords = [];
      let shuffledWordIndex = 0;
      let lastWord = null;

      // Vibrant background palette: hue values to cycle through
      const bgColors = [
        "#ff6b6b",
        "#ffa94d",
        "#ffd43b",
        "#a9e34b",
        "#40c057",
        "#20c997",
        "#22b8cf",
        "#339af0",
        "#5c7cfa",
        "#845ef7",
        "#cc5de8",
        "#f06595",
        "#ff8787",
        "#ffc078",
        "#ffe066",
        "#c0eb75",
        "#63e6be",
        "#74c0fc",
        "#91a7ff",
        "#da77f2",
        "#e64980",
        "#d6336c",
        "#f03e3e",
        "#e8590c",
        "#f59f00",
        "#2f9e44",
        "#0ca678",
        "#1098ad",
        "#1971c2",
        "#7048e8",
        "#b5179e",
        "#7209b7",
        "#480ca8",
        "#3a0ca3",
        "#023e8a",
        "#006d77",
        "#264653",
        "#2a9d8f",
        "#e9c46a",
        "#f4a261",
        "#e76f51",
        "#8ecae6",
        "#219ebc",
        "#023047",
        "#ffb703",
        "#fb8500",
        "#00b4d8",
        "#0096c7",
        "#0077b6",
        "#023e8a",
        "#d62828",
        "#f77f00",
        "#fcbf49",
        "#eae2b7",
        "#003049",
        "#6a994e",
        "#386641",
        "#bc4749",
        "#a7c957",
        "#f2e8cf",
        "#e9c46a",
        "#57cc99",
        "#80ed99",
        "#38a3a5",
        "#22577a",
      ];

      let lastBgIndex = -1;

      const FADE_MS = 150;
      const RESIZE_DEBOUNCE_MS = 100;
      const PETAL_SPAWN_INTERVAL_MS = 85;
      const MAX_TEXT_WIDTH_RATIO = 0.8;
      const MAX_FONT_WIDTH_RATIO = 0.18;
      const MAX_FONT_HEIGHT_RATIO = 0.25;
      const MIN_FONT_SIZE_PX = 28;
      const MAX_TILT_DEG_DESKTOP = 15;
      const MAX_TILT_DEG_MOBILE = 20;
      const TILT_EASING = 0.14;
      let currentTiltX = 0;
      let currentTiltY = 0;
      let targetTiltX = 0;
      let targetTiltY = 0;
      let tiltAnimationFrame = null;
      let gyroTiltEnabled = false;
      let gyroListenerAttached = false;
      let activePointerId = null;
      let isPetalSpawning = false;
      let petalSpawnTimer = null;
      let petalSpawnX = 0;
      let petalSpawnY = 0;
      let score = 0;
      let hasStarted = false;
      let currentWordEmoji = "✨";
      let wordUpdateTimer = null;

      const audioPlayerEl = document.getElementById("audio-player");
      const backgroundMusicEl = document.getElementById("background-music");
      const wordmarkEl = document.getElementById("wordmark");
      const highScoreEl = document.getElementById("high-score");
      const scoreValueEl = document.getElementById("score-value");
      const menuButtonEl = document.getElementById("menu-button");
      const gameMenuEl = document.getElementById("game-menu");
      const closeMenuEl = document.getElementById("close-menu");
      const resetGameEl = document.getElementById("reset-game");

      function syncPlayfieldMetrics() {
        const audioBounds = audioPlayerEl.getBoundingClientRect();
        const gap = Math.max(16, Math.round(window.innerHeight * 0.022));
        const emojiZoneBottom = Math.max(
          96,
          Math.ceil(window.innerHeight - audioBounds.top + gap),
        );
        document.body.style.setProperty(
          "--emoji-zone-bottom",
          `${emojiZoneBottom}px`,
        );
      }

      function startGame() {
        if (hasStarted) return;
        hasStarted = true;
        document.body.classList.add("game-started");
        wordmarkEl.setAttribute(
          "aria-label",
          document.getElementById("top-word").textContent,
        );
        fitWordmark();
      }

      const emojiStream = window.PiniEmojiStream.createEmojiStream({
        container: document.getElementById("emoji-stream"),
        onEmojiClick: handleEmojiClick,
      });

      function resetGame() {
        if (wordUpdateTimer !== null) {
          window.clearTimeout(wordUpdateTimer);
          wordUpdateTimer = null;
        }

        stopPetalSpawner();
        score = 0;
        scoreValueEl.textContent = "0";
        highScoreEl.setAttribute("aria-label", "High score 0");
        hasStarted = false;
        currentWordEmoji = "✨";
        lastWord = null;
        shuffledWords = [];
        shuffledWordIndex = 0;
        lastBgIndex = -1;
        document.body.classList.remove("game-started");
        document.body.style.backgroundColor = bgColors[0];
        wordmarkEl.style.opacity = "1";
        wordmarkEl.style.fontSize = "";
        document.getElementById("top-word").textContent = "Clickini";
        document.getElementById("bottom-word").textContent = "Pini";
        wordmarkEl.setAttribute("aria-label", "Clickini Pini");
        emojiStream.reset?.();
        updateGetWellSoonEmojis();
        syncPlayfieldMetrics();
        fitWordmark();
        gameMenuEl.close();
      }

      function openMenu() {
        if (gameMenuEl.open) return;
        gameMenuEl.showModal();
        menuButtonEl.setAttribute("aria-expanded", "true");
        closeMenuEl.focus();
      }

      menuButtonEl.addEventListener("click", openMenu);
      closeMenuEl.addEventListener("click", () => gameMenuEl.close());
      resetGameEl.addEventListener("click", resetGame);
      gameMenuEl.addEventListener("click", (event) => {
        if (event.target === gameMenuEl) gameMenuEl.close();
      });
      gameMenuEl.addEventListener("close", () => {
        menuButtonEl.setAttribute("aria-expanded", "false");
        menuButtonEl.focus();
      });

      const audioVisualizer =
        window.PiniAudioVisualizer.createAudioVisualizer({
          audioElement: backgroundMusicEl,
          targetElement: document.getElementById("top-word"),
          canvasElement: document.getElementById("audio-glow"),
        });

      window.PiniAudioPlayer.createAudioPlayerController({
        audioElement: backgroundMusicEl,
        playerElement: audioPlayerEl,
        visualizer: audioVisualizer,
        tracks: [
          {
            title: "Get Well Soon",
            src: "audio/20260916-142727-77c9dd-web-small.mp3",
          },
          { title: "Pini Macedonini", src: "audio/pini-background.mp3" },
        ],
        playlistElement: document.getElementById("playlist-menu"),
      });

      const getWellSoonAudioSrc =
        "audio/20260916-142727-77c9dd-web-small.mp3";
      emojiStream.setSpecialEmojis?.(["❤️‍🩹", "🩹"]);

      function updateGetWellSoonEmojis() {
        const isGetWellSoonPlaying =
          !backgroundMusicEl.paused &&
          backgroundMusicEl.currentSrc.endsWith(getWellSoonAudioSrc);
        emojiStream.setSpecialEmojiActive?.(isGetWellSoonPlaying);
      }

      backgroundMusicEl.addEventListener("play", updateGetWellSoonEmojis);
      backgroundMusicEl.addEventListener("pause", updateGetWellSoonEmojis);

      const useGyroTilt = window.matchMedia(
        "(hover: none) and (pointer: coarse)",
      ).matches;

      function pickRandom(arr, lastIndex) {
        let idx;
        do {
          idx = Math.floor(Math.random() * arr.length);
        } while (idx === lastIndex && arr.length > 1);
        return { value: arr[idx], index: idx };
      }

      function shuffleInPlace(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
      }

      function refillShuffledWords() {
        shuffledWords = [...allWords];
        shuffleInPlace(shuffledWords);
        if (shuffledWords.length > 1 && shuffledWords[0].word === lastWord) {
          [shuffledWords[0], shuffledWords[1]] = [
            shuffledWords[1],
            shuffledWords[0],
          ];
        }
        shuffledWordIndex = 0;
      }

      function getNextWord() {
        if (shuffledWordIndex >= shuffledWords.length) {
          refillShuffledWords();
        }
        const word = shuffledWords[shuffledWordIndex++];
        lastWord = word.word;
        return word;
      }

      function normalizeWord(rawWord) {
        if (typeof rawWord !== "string") return null;
        const cleaned = rawWord.trim().replace(/[^\p{L}'-]/gu, "");
        if (!cleaned) return null;
        return cleaned.charAt(0).toUpperCase() + cleaned.slice(1).toLowerCase();
      }

      function applyDisplayWord(word) {
        if (word.endsWith("ie")) return word.slice(0, -2) + "ini";
        if (word.endsWith("ia")) return word.slice(0, -2) + "ini";
        if (/[aeiouy]$/i.test(word)) return word.slice(0, -1) + "ini";
        return word + "ini";
      }

      function createConfetti(x, y) {
        const flowers = ["🌸", "🌺", "🌼", "🌻", "🌷", "💮", "🏵️"];
        const count = 14;
        for (let i = 0; i < count; i++) {
          const el = document.createElement("span");
          el.className = "confetti-flower";
          el.textContent = flowers[Math.floor(Math.random() * flowers.length)];
          const angle = (i / count) * 2 * Math.PI + Math.random() * 0.4;
          const dist = 70 + Math.random() * 130;
          const dx = Math.cos(angle) * dist;
          const dy = Math.sin(angle) * dist - 30;
          const rot = (Math.random() - 0.5) * 720;
          const dur = (0.9 + Math.random() * 0.5).toFixed(2) + "s";
          el.style.left = `${x}px`;
          el.style.top = `${y}px`;
          el.style.setProperty("--dx", `${dx}px`);
          el.style.setProperty("--dy", `${dy}px`);
          el.style.setProperty("--rot", `${rot}deg`);
          el.style.setProperty("--dur", dur);
          el.style.animationDelay = `${(Math.random() * 0.15).toFixed(2)}s`;
          document.body.appendChild(el);
          el.addEventListener("animationend", () => el.remove());
        }
      }

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function applyWordmarkTilt() {
        wordmarkEl.style.setProperty(
          "--tilt-x",
          `${currentTiltX.toFixed(2)}deg`,
        );
        wordmarkEl.style.setProperty(
          "--tilt-y",
          `${currentTiltY.toFixed(2)}deg`,
        );
      }

      function animateTilt() {
        currentTiltX += (targetTiltX - currentTiltX) * TILT_EASING;
        currentTiltY += (targetTiltY - currentTiltY) * TILT_EASING;
        applyWordmarkTilt();

        const settled =
          Math.abs(targetTiltX - currentTiltX) < 0.02 &&
          Math.abs(targetTiltY - currentTiltY) < 0.02;

        if (settled) {
          currentTiltX = targetTiltX;
          currentTiltY = targetTiltY;
          applyWordmarkTilt();
          tiltAnimationFrame = null;
          return;
        }

        tiltAnimationFrame = requestAnimationFrame(animateTilt);
      }

      function setTiltTarget(nextTiltX, nextTiltY) {
        targetTiltX = nextTiltX;
        targetTiltY = nextTiltY;
        if (tiltAnimationFrame === null) {
          tiltAnimationFrame = requestAnimationFrame(animateTilt);
        }
      }

      function setTiltFromScreenPoint(clientX, clientY, maxTiltDeg) {
        const normalizedX = clamp((clientX / window.innerWidth) * 2 - 1, -1, 1);
        const normalizedY = clamp(
          (clientY / window.innerHeight) * 2 - 1,
          -1,
          1,
        );
        setTiltTarget(normalizedY * maxTiltDeg, -normalizedX * maxTiltDeg);
      }

      function setTiltFromPointer(clientX, clientY) {
        setTiltFromScreenPoint(clientX, clientY, MAX_TILT_DEG_DESKTOP);
      }

      function handleDeviceOrientation(event) {
        if (typeof event.beta !== "number" || typeof event.gamma !== "number") {
          return;
        }

        gyroTiltEnabled = true;

        const normalizedBeta = clamp(event.beta / 35, -1, 1);
        const normalizedGamma = clamp(event.gamma / 35, -1, 1);
        setTiltTarget(
          normalizedBeta * MAX_TILT_DEG_MOBILE,
          -normalizedGamma * MAX_TILT_DEG_MOBILE,
        );
      }

      async function enableGyroTilt({ fromUserGesture = false } = {}) {
        if (
          !useGyroTilt ||
          typeof window.DeviceOrientationEvent === "undefined"
        ) {
          return false;
        }

        if (
          typeof window.DeviceOrientationEvent.requestPermission === "function"
        ) {
          if (!fromUserGesture) {
            return false;
          }

          const permission =
            await window.DeviceOrientationEvent.requestPermission();
          if (permission !== "granted") {
            return false;
          }
        }

        if (!gyroListenerAttached) {
          window.addEventListener(
            "deviceorientation",
            handleDeviceOrientation,
            {
              passive: true,
            },
          );
          gyroListenerAttached = true;
        }

        return true;
      }

      function fitWordmark() {
        const topWordEl = document.getElementById("top-word");
        const bottomWordEl = document.getElementById("bottom-word");
        const isGameStarted = document.body.classList.contains("game-started");
        const maxWidthPx = parseFloat(
          getComputedStyle(document.body).getPropertyValue(
            "--wordmark-max-width",
          ),
        );
        const safeMaxWidthPx = Number.isFinite(maxWidthPx)
          ? maxWidthPx
          : window.innerWidth;
        const maxWidth = Math.min(
          window.innerWidth *
            (isGameStarted ? MAX_TEXT_WIDTH_RATIO * 0.9 : MAX_TEXT_WIDTH_RATIO),
          safeMaxWidthPx,
        );
        const bodyStyles = getComputedStyle(document.body);
        const bodyPaddingTop = parseFloat(bodyStyles.paddingTop) || 0;
        const bodyPaddingBottom = parseFloat(bodyStyles.paddingBottom) || 0;
        const availableHeight =
          window.innerHeight -
          bodyPaddingTop -
          bodyPaddingBottom;
        const maxHeight = Math.max(MIN_FONT_SIZE_PX * 2, availableHeight);
        const maxSize = Math.floor(
          Math.min(
            window.innerWidth *
              (isGameStarted
                ? MAX_FONT_WIDTH_RATIO * 0.56
                : MAX_FONT_WIDTH_RATIO),
            window.innerHeight *
              (isGameStarted
                ? MAX_FONT_HEIGHT_RATIO * 0.56
                : MAX_FONT_HEIGHT_RATIO),
          ),
        );
        let low = isGameStarted ? 22 : MIN_FONT_SIZE_PX;
        let high = Math.max(MIN_FONT_SIZE_PX, maxSize);
        let best = low;

        while (low <= high) {
          const mid = Math.floor((low + high) / 2);
          wordmarkEl.style.fontSize = `${mid}px`;
          const hasNoWrapping =
            topWordEl.getClientRects().length <= 1 &&
            bottomWordEl.getClientRects().length <= 1;
          const contentWidth = Math.max(
            topWordEl.getBoundingClientRect().width,
            bottomWordEl.getBoundingClientRect().width,
          );
          const fits =
            contentWidth <= maxWidth &&
            wordmarkEl.scrollHeight <= maxHeight &&
            hasNoWrapping;

          if (fits) {
            best = mid;
            low = mid + 1;
          } else {
            high = mid - 1;
          }
        }

        wordmarkEl.style.fontSize = `${best}px`;
      }

      function update() {
        const wordEntry = getNextWord();
        const { value: bg, index: bgIdx } = pickRandom(bgColors, lastBgIndex);
        lastBgIndex = bgIdx;

        const prefix = applyDisplayWord(wordEntry.word);
        currentWordEmoji = wordEntry.emoji;
        emojiStream.setEmoji(currentWordEmoji);

        const wordmarkEl = document.getElementById("wordmark");
        const topWordEl = document.getElementById("top-word");
        const bottomWordEl = document.getElementById("bottom-word");
        wordmarkEl.style.opacity = "0";
        if (wordUpdateTimer !== null) {
          window.clearTimeout(wordUpdateTimer);
        }
        wordUpdateTimer = window.setTimeout(() => {
          wordUpdateTimer = null;
          topWordEl.textContent = prefix;
          bottomWordEl.textContent = "Pini";
          wordmarkEl.setAttribute(
            "aria-label",
            document.body.classList.contains("game-started")
              ? prefix
              : `${prefix} Pini`,
          );

          requestAnimationFrame(() => {
            fitWordmark();
            wordmarkEl.style.opacity = "1";
          });
        }, FADE_MS);
        document.body.style.backgroundColor = bg;
      }

      function spawnPetalBurst() {
        createConfetti(petalSpawnX, petalSpawnY);
      }

      function stopPetalSpawner() {
        isPetalSpawning = false;
        activePointerId = null;
        if (petalSpawnTimer !== null) {
          clearInterval(petalSpawnTimer);
          petalSpawnTimer = null;
        }
      }

      function startPetalSpawner(clientX, clientY, pointerId) {
        petalSpawnX = clientX;
        petalSpawnY = clientY;

        isPetalSpawning = true;
        activePointerId = pointerId;
        spawnPetalBurst();

        if (petalSpawnTimer !== null) {
          clearInterval(petalSpawnTimer);
        }

        petalSpawnTimer = setInterval(spawnPetalBurst, PETAL_SPAWN_INTERVAL_MS);
      }

      function handleEmojiClick(event, clickedEmoji) {
        startGame();
        score += 1;
        scoreValueEl.textContent = score;
        highScoreEl.setAttribute("aria-label", `High score ${score}`);
        if (clickedEmoji === currentWordEmoji) {
          update();
        }
        startPetalSpawner(event.clientX, event.clientY, event.pointerId);
      }

      function handleWordmarkClick() {
        if (hasStarted) return;
        startGame();
        update();
      }

      let resizeTimer = null;
      window.addEventListener("resize", () => {
        syncPlayfieldMetrics();
        if (resizeTimer) clearTimeout(resizeTimer);
        resizeTimer = setTimeout(fitWordmark, RESIZE_DEBOUNCE_MS);
      });

      if (useGyroTilt) {
        enableGyroTilt().catch(() => {});

        window.addEventListener(
          "touchmove",
          (event) => {
            if (gyroTiltEnabled) return;
            const touch = event.touches && event.touches[0];
            if (!touch) return;
            setTiltFromScreenPoint(
              touch.clientX,
              touch.clientY,
              MAX_TILT_DEG_MOBILE,
            );
          },
          { passive: true },
        );

        window.addEventListener("touchend", () => {
          if (!gyroTiltEnabled) setTiltTarget(0, 0);
        });

        const unlockGyroTilt = async () => {
          const enabled = await enableGyroTilt({ fromUserGesture: true });
          if (!enabled) return;
          setTiltTarget(0, 0);
        };

        window.addEventListener("click", unlockGyroTilt, {
          passive: true,
          once: true,
        });
        window.addEventListener("touchend", unlockGyroTilt, {
          passive: true,
          once: true,
        });
        window.addEventListener("pointerup", unlockGyroTilt, {
          passive: true,
          once: true,
        });
      } else {
        window.addEventListener(
          "mousemove",
          (event) => {
            setTiltFromPointer(event.clientX, event.clientY);
          },
          { passive: true },
        );
        window.addEventListener("mouseleave", () => setTiltTarget(0, 0));
        window.addEventListener("blur", () => setTiltTarget(0, 0));
      }

      window.addEventListener(
        "pointermove",
        (event) => {
          if (!isPetalSpawning || event.pointerId !== activePointerId) return;
          petalSpawnX = event.clientX;
          petalSpawnY = event.clientY;
        },
        { passive: true },
      );

      window.addEventListener("pointerup", (event) => {
        if (event.pointerId !== activePointerId) return;
        stopPetalSpawner();
      });

      window.addEventListener("pointercancel", (event) => {
        if (event.pointerId !== activePointerId) return;
        stopPetalSpawner();
      });

      window.addEventListener("blur", stopPetalSpawner);
      wordmarkEl.addEventListener("pointerdown", handleWordmarkClick);
      syncPlayfieldMetrics();
      fitWordmark();
      window.addEventListener("load", fitWordmark);
    </script>
  </body>
</html>
